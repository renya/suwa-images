<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>下諏訪町地図｜shimosuwa.info</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map');

// URLパラメータ取得
const params = new URLSearchParams(window.location.search);

const lat = parseFloat(params.get('lat'));
const lng = parseFloat(params.get('lng'));
const name = params.get('name');
const zoom = parseInt(params.get('zoom')) || 14;

// 緯度経度がある場合
if (!isNaN(lat) && !isNaN(lng)) {

// 緯度経度がある場合
    map.setView([lat, lng], zoom);

    // 指定地点にマーカー表示
    L.circleMarker([lat, lng], {
        radius: 6,
        color: '#ff3333',
        fillColor: '#ff3333',
        fillOpacity: 0.9
    })
    .addTo(map)
    .bindPopup(name || (lat + ", " + lng))
    .openPopup();

}

// 緯度経度を左クリックで表示するJavaScript
map.on('click', function(e) {
    L.popup()
        .setLatLng(e.latlng)
        .setContent(
            e.latlng.lat.toFixed(6) +
            ", " +
            e.latlng.lng.toFixed(6)
        )
        .openOn(map);
});

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

const points = [
    [36.050109, 138.086107], // 諏訪湖中心
    [36.060671, 138.074675], // 諏訪湖岡谷側
    [36.096361, 138.068280], // 西側部
    [36.129684, 138.078569], // 西側部
    [36.122594, 138.101443], // 西側部
    [36.149942, 138.092113], // 西側部
    [36.138153, 138.091768], // 西側部
    [36.146729, 138.081745], // 西側部
    [36.157496, 138.088327], // 二子山近く境界
    [36.166472, 138.127835], // 三峰山3境界
    [36.112504, 138.171632], // 八島湿原東南部 ヒュッテみさやま
    [36.112137, 138.164146], // 東側部
    [36.105208, 138.174484], // 東側部
    [36.100250, 138.157901], // 東側部
    [36.102919, 138.141852], // 東側部
    [36.088024, 138.137690], // 東側部
    [36.087102, 138.123940], // 東側部
    [36.081019, 138.130450], // 東側部
    [36.073328, 138.121301], // 東側部
    [36.068855, 138.119306], // 東側部
    [36.060623, 138.109049], // 諏訪湖諏訪市側
    [36.050109, 138.086107]  // 最初へ戻る
];

const markers = [];

points.forEach((p, i) => {

const marker = L.circleMarker(p, {
    radius: 3,          // 点のサイズ (半径(px))
    color: '#666',      // 点の線の色 (外周色)
    fillColor: '#666',  // 点の内部色 (内部塗り色)
    fillOpacity: 0.5    // 点の透明度 (不透明度)
})
        .addTo(map)
        .bindPopup(
            "Point " + (i + 1) + "<br>" +
            p[0] + ", " + p[1]
        );

    markers.push(marker);
});

const polygon = L.polygon(points, {
    color: '#3388ff',     // 線の色を指定
    weight: 2,            // 線の太さ
    opacity: 0.6,         // 線の透明度
    fillColor: '#66aaff', // 内側の塗り色
    fillOpacity: 0.15     // 内側の透明度
}).addTo(map);

const group = L.featureGroup(markers);

// URL指定が無い時だけ全体表示
if (isNaN(lat) || isNaN(lng)) {

    map.fitBounds(group.getBounds(), {
        padding: [30, 30]
    });

}

</script>

</body>
</html>
