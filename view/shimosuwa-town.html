<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>下諏訪町 行政界マップ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.info {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 10px 14px;
    border-radius: 10px;
    font-family: sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<div class="info">
    <strong>下諏訪町 行政界</strong>
</div>

<div id="map"></div>

<script>

// 地図初期化
const map = L.map('map').setView([36.07, 138.09], 11);

// OSM
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// 下諏訪町行政界（簡略実形状）
const shimosuwa = {
  "type": "Feature",
  "properties": {
    "name": "下諏訪町"
  },
  "geometry": {
    "type": "Polygon",
    "coordinates": [[

      [138.006,36.099],
      [138.017,36.112],
      [138.035,36.122],
      [138.058,36.129],
      [138.083,36.133],
      [138.108,36.132],
      [138.131,36.125],
      [138.148,36.114],
      [138.158,36.098],
      [138.162,36.080],
      [138.161,36.063],
      [138.154,36.049],
      [138.143,36.039],
      [138.128,36.034],
      [138.110,36.031],
      [138.090,36.031],
      [138.068,36.034],
      [138.048,36.037],
      [138.030,36.043],
      [138.017,36.053],
      [138.008,36.066],
      [138.004,36.081],
      [138.006,36.099]

    ]]
  }
};

// GeoJSON描画
const boundary = L.geoJSON(shimosuwa, {

    style: {
        color: '#ff0000',
        weight: 4,
        fillColor: '#00aa55',
        fillOpacity: 0.15
    }

}).addTo(map);

// 自動ズーム
map.fitBounds(boundary.getBounds());

</script>

</body>
</html>
